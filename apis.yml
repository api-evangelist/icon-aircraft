aid: icon-aircraft
name: ICON Aircraft
description: >-
  ICON Aircraft is an American light-sport aircraft manufacturer founded in 2006 by Kirk Hawkins and
  Steen Strand and headquartered in Vacaville, California. It designs, builds and sells the ICON A5,
  an amphibious two-seat S-LSA with folding wings, a spin-resistant airframe, an optional ICON
  Parachute System and a Rotax 912iS engine, sold alongside flight training, a certified pre-owned
  program and a service-provider network. The A5 entered production in 2016 and received FAA type
  certification in the primary category in December 2023. Since April 2025 ICON has been a sister
  company of Flight Design under Shang Gong Group. ICON is an aircraft manufacturer, not a software
  vendor: it operates no developer program, publishes no product API, no SDKs and no developer
  portal. Two machine-readable surfaces do exist on its own domains and are profiled here — the
  WordPress REST content API behind www.iconaircraft.com, which is anonymously readable and
  read-only, and the Shopify-hosted Shop ICON merchandise storefront at store.iconaircraft.com,
  which serves storefront JSON plus a live, anonymous Universal Commerce Protocol MCP endpoint with
  thirteen catalog, cart, checkout and order tools.
