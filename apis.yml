- aid: icon-aircraft:icon-aircraft-ucp-mcp
  name: Shop ICON UCP/MCP Server
  description: >-
    A live, anonymously callable Model Context Protocol endpoint implementing the Universal Commerce Protocol
    2026-04-08 for the Shop ICON storefront. An unauthenticated tools/list returned HTTP 200 with thirteen
    tools — search_catalog, lookup_catalog, get_product, create/get/update/cancel cart, create/get/update/complete/cancel
    checkout and get_order — each carrying a real JSON Schema 2020-12 inputSchema. This is a Shopify platform
    capability served under ICON Aircraft's own domain and scoped to ICON's own merchant account; it is
    the only agent-callable surface the company exposes. Checkout completion requires contemporaneous
    human approval.
  humanURL: https://store.iconaircraft.com/agents.md
  baseURL: https://store.iconaircraft.com/api/ucp/mcp
