generated: '2026-08-22'
method: probed
source: https://store.iconaircraft.com/api/ucp/mcp
name: Shop ICON UCP/MCP Server
status: live
deployment:
  mode: remote
  endpoint: https://store.iconaircraft.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    Anonymous POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} returned HTTP 200 with a full
    tool manifest — 13 tools, each with a real JSON Schema 2020-12 inputSchema — on 2026-08-22.
    No install step and no package: this is a hosted endpoint an MCP client can call today.
    The canonical origin declared in /.well-known/ucp is
    https://iconaircraft.myshopify.com/api/ucp/mcp; the store-domain URL above is the one named in
    /agents.md and /robots.txt and is the one that was probed.
discovery:
  robots_txt: https://store.iconaircraft.com/robots.txt
  agents_md: https://store.iconaircraft.com/agents.md
  llms_txt: https://store.iconaircraft.com/llms.txt
  ucp_profile: https://store.iconaircraft.com/.well-known/ucp
  oauth_protected_resource: https://store.iconaircraft.com/.well-known/oauth-protected-resource/api/ucp/mcp
protocol:
  name: Universal Commerce Protocol
  spec: https://ucp.dev/2026-04-08/specification/overview/
  version: '2026-04-08'
  also_supported:
    - '2026-01-23'
  transport: mcp
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
provenance_note: >-
  This is a Shopify platform capability, not software ICON Aircraft wrote. It is recorded against
  ICON Aircraft because it is served from ICON Aircraft's own domain, is scoped to ICON's own
  merchant account (Shopify shop id 376732, "Shop ICON", Vacaville CA — ICON's headquarters), and
  operates exclusively on ICON's own catalog, carts and orders. It is the only agent-callable
  surface ICON Aircraft exposes; the corporate site at www.iconaircraft.com exposes none.
capabilities:
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.order
  - dev.shopify.catalog
payment_handlers:
  - com.google.pay
  - dev.shopify.card
  - dev.shopify.shop_pay
tool_manifest: mcp/icon-aircraft-ucp-mcp-tools.json
tool_count: 13
tools:
  - name: search_catalog
    category: catalog
    description: Search for products from the online store, hosted on Shopify.
  - name: lookup_catalog
    category: catalog
    description: Look up multiple products or variants by identifier.
  - name: get_product
    category: catalog
    description: Retrieve complete product detail by identifier. Returns a singular product.
  - name: create_cart
    category: cart
    description: Creates a new cart.
  - name: get_cart
    category: cart
    description: Get the cart contents.
  - name: update_cart
    category: cart
    description: Perform updates to a cart.
  - name: cancel_cart
    category: cart
    description: Cancels a cart.
  - name: create_checkout
    category: checkout
    description: Creates a checkout and returns line items, totals, discounts and taxes.
  - name: get_checkout
    category: checkout
    description: Returns details about the checkout, including line items, totals, discounts and taxes.
  - name: update_checkout
    category: checkout
    description: Updates a checkout — shipping address, fulfillment method, payment instruments.
  - name: complete_checkout
    category: checkout
    description: >-
      Completes a checkout, returning the order id and thank-you page URL. Requires explicit,
      contemporaneous buyer approval of payment; the store's agents.md forbids unattended completion.
  - name: cancel_checkout
    category: checkout
    description: Cancels a checkout.
  - name: get_order
    category: order
    description: Get the details of an order.
conventions:
  money: >-
    Every price in a tool response is an integer in ISO 4217 minor units paired with a currency
    code — {"amount": 2500, "currency": "USD"} is $25.00. Agents must convert before quoting.
  required_meta: >-
    Every tool requires a `meta.ucp-agent.profile` URI so the store can identify the calling agent.
  identifiers: Shopify global ids, for example gid://shopify/Checkout/abc123.
guardrails:
  - >-
    Checkout requires human approval. The store's published agent instructions state that agents
    must not complete payment without explicit, contemporaneous buyer consent, and forbid scripted
    form fills or end-to-end automation that finalizes payment.
  - The MCP endpoint is rate-limited per IP; back off on HTTP 429.
