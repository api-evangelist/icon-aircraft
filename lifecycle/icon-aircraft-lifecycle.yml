summary: >-
  ICON Aircraft publishes no API lifecycle commitments of any kind — no versioning policy, no
  deprecation policy, no Sunset or Deprecation headers, no SLA, no status page and no changelog.
  That is the expected posture for an aircraft manufacturer with no developer program, and it is
  recorded here as an honest absence rather than a gap the company failed to fill. The only
  versioning visible anywhere in the profile belongs to the platforms underneath it.
status_page:
  present: false
  url: null
  note: >-
    status.iconaircraft.com resolves only through a wildcard DNS record to the corporate site's
    origin and presents a certificate that does not cover the name; no status service exists.
    No third-party status page (Statuspage, Instatus, Better Stack) was found for either host.
deprecation_policy:
  present: false
  url: null
  headers_observed: []
