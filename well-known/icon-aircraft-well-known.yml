source: >-
  Anonymous GET probes of each /.well-known/ path on every host in this profile, 2026-08-22.
note: >-
  www.iconaircraft.com serves nothing at any /.well-known/ path — every probe returned the site's
  WordPress 404 template. store.iconaircraft.com, the Shopify-hosted Shop ICON storefront, serves
  four real documents: the Universal Commerce Protocol merchant profile, OpenID Connect discovery,
  OAuth 2.0 authorization-server metadata, and RFC 9728 OAuth protected-resource metadata for the
  storefront and for its UCP/MCP endpoint. Those four are Shopify platform documents served under
  ICON Aircraft's own domain and scoped to ICON's own merchant id (376732, "Shop ICON").
  No security.txt and no api-catalog are served on any host.
